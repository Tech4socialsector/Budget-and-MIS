<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Table with Export Options</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.4.1/css/responsive.bootstrap5.min.css">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.4.1/js/dataTables.responsive.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #343a40;
        }
        table.dataTable {
            border-collapse: collapse !important;
        }
        .dt-buttons {
            margin-bottom: 10px;
        }
        /* Block white export buttons for a matching look */
        .btn-block-white {
            background-color: #fff !important;
            color: #212529 !important;
            border: 2px solid #dee2e6 !important;
            font-weight: 600;
            box-shadow: 0 2px 2px rgba(33, 37, 41, 0.07);
        }
        .btn-block-white:hover, .btn-block-white:focus {
            background-color: #f8f9fa !important;
            color: #1565c0 !important;
            border-color: #1565c0 !important;
        }
        .web-footer,
        .navbar.navbar-light.navbar-expand-lg {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">Finance Budget Table</h2>
        <table id="budgetTable" class="table table-striped table-bordered" style="width:100%">
            <thead class="table-dark">
                <tr>
                    <th>Entity</th>
                    <th>GL Description</th>
                    <th>GL</th>
                    <th>Currency</th>
                    <th>Amount</th>
                    <th>Cost Centre</th>
                    <th>Location</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>APES</td>
                    <td>Travel - Local - Conveyance & Boarding</td>
                    <td>73201</td>
                    <td>INR</td>
                    <td>30.00</td>
                    <td>9</td>
                    <td>81</td>
                </tr>
                <tr>
                    <td>APES</td>
                    <td>Travel Expenses</td>
                    <td>71001</td>
                    <td>INR</td>
                    <td>40.00</td>
                    <td>9</td>
                    <td>81</td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        var jq364 = jQuery.noConflict(true);
        jq364(document).ready(function() {
            jq364('#budgetTable').DataTable({
                responsive: true,
                dom: 'Bfrtip',
                buttons: [
                    {
                        extend: 'csv',
                        className: 'btn btn-block-white',
                        title: 'Budget_Data'
                    },
                    {
                        extend: 'excel',
                        className: 'btn btn-block-white',
                        title: 'Budget_Data'
                    },
                    {
                        extend: 'pdf',
                        className: 'btn btn-block-white',
                        title: 'Budget_Data'
                    }
                ],
                columnDefs: [
                    { responsivePriority: 1, targets: 0 },
                    { responsivePriority: 1, targets: 1 },
                    { responsivePriority: 1, targets: 4 },
                    { responsivePriority: 2, targets: 2 },
                    { responsivePriority: 3, targets: 3 },
                    { responsivePriority: 4, targets: 5 },
                    { responsivePriority: 5, targets: 6 }
                ]
            });
        });
    </script>
</body>
</html>
