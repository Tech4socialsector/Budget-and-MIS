[project]
name = "annual_budget"
authors = [
    { name = "Augustin Moses", email = "tech4socialsector@azimpremjifoundation.org" }
]
description = "A custom app to manage and track annual budget allocations"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

dependencies = [
    "xmltodict==0.13.0",
    "XlsxWriter==3.2.0",
    "cryptography>=42.0.0"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<18.0.0" 

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]

ignore = [
    "B017",
    "B018",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "E741",
    "F401",
    "F403",
    "F405",
    "F722",
    "W191",
    "UP030",
    "UP031",
    "UP032",
]

typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true